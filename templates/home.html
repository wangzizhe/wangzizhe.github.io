<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="{{PREFIX}}assets/favicon.png" />
    <title>{{PAGE_TITLE}}</title>
    <meta
      name="description"
      content="{{DESCRIPTION}}"
    />
{{SEO}}
    <link rel="stylesheet" href="{{PREFIX}}styles.css?v={{STYLE_VERSION}}" />
{{THEME_INIT}}
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <div class="nav-right">
          <div class="theme-switch" aria-label="Theme switcher"></div>
          <div class="lang-switch" aria-label="Language switcher">
            <a class="lang-btn{{ZH_ACTIVE}}" href="{{ZH_HREF}}"{{ZH_CURRENT}}>中</a>
            <a class="lang-btn{{EN_ACTIVE}}" href="{{EN_HREF}}"{{EN_CURRENT}}>EN</a>
          </div>
        </div>
      </nav>

      <section class="hero">
        <h1>{{HERO_TITLE}}<span class="hero-emoji">😸</span></h1>
        <p class="hero-text">
          <span class="hero-copy">{{HERO_TEXT}}</span><span class="hero-typing" aria-hidden="true"></span>
        </p>
      </section>
    </header>

    <main>
      <section id="posts">
        <div class="post-grid">
{{POST_CARDS}}
        </div>
      </section>
    </main>

{{FOOTER}}

    <script src="{{PREFIX}}blog-index.js?v={{HOME_SCRIPT_VERSION}}"></script>
    <script src="{{PREFIX}}theme-toggle.js?v={{THEME_SCRIPT_VERSION}}"></script>
  </body>
</html>
