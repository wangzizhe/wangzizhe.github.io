<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/favicon.png" />
    <title>{{PAGE_TITLE}}</title>
    <meta
      name="description"
      content="{{DESCRIPTION}}"
    />
{{SEO}}
    <link rel="stylesheet" href="../styles.css" />
{{THEME_INIT}}
  </head>
  <body>
    <main class="post-layout">
      <nav class="nav post-nav">
        <a class="post-back" href="{{HOME_HREF}}">{{BACK_LABEL}}</a>
        <div class="nav-right">
          <div class="theme-switch" aria-label="Theme switcher"></div>
          <div class="lang-switch" aria-label="Language switcher">
            <a class="lang-btn{{ZH_ACTIVE}}" href="./{{ZH_FILE}}"{{ZH_CURRENT}}>中</a>
            <a class="lang-btn{{EN_ACTIVE}}" href="./{{EN_FILE}}"{{EN_CURRENT}}>EN</a>
          </div>
        </div>
      </nav>
      <header class="post-header">
        <time class="post-date" datetime="{{DATE}}">{{DATE}}</time>
        <h1>{{POST_TITLE}}</h1>
      </header>
      <article class="post-article">
{{ARTICLE_BODY}}
        <section class="share-section" aria-label="{{SHARE_LABEL}}"></section>
      </article>
    </main>

{{FOOTER}}

    <script src="../post-share.js"></script>
    <script src="../theme-toggle.js"></script>
  </body>
</html>
