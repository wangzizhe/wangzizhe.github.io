<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/favicon.png" />
    <title>{{PAGE_TITLE}}</title>
    <meta
      name="description"
      content="{{DESCRIPTION}}"
    />
{{SEO}}
    <link rel="stylesheet" href="../styles.css?v={{STYLE_VERSION}}" />
{{THEME_INIT}}
  </head>
  <body>
    <main class="post-layout">
      <nav class="nav post-nav">
        <a class="post-back" href="{{HOME_HREF}}">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="m10 4-4 4 4 4" />
          </svg>
          {{BACK_LABEL}}
        </a>
        <div class="nav-right">
          <div class="theme-switch" aria-label="Theme switcher"></div>
          <div class="lang-switch" aria-label="Language switcher">
            <a class="lang-btn{{ZH_ACTIVE}}" href="./{{ZH_FILE}}"{{ZH_CURRENT}}><span class="lang-label">中</span></a>
            <a class="lang-btn{{EN_ACTIVE}}" href="./{{EN_FILE}}"{{EN_CURRENT}}><span class="lang-label">EN</span></a>
          </div>
        </div>
      </nav>
      <header class="post-header">
        <time class="post-date" datetime="{{DATE}}">{{DATE}}</time>
        <h1>{{POST_TITLE}}</h1>
      </header>
      <article class="post-article">
{{ARTICLE_BODY}}
        <section class="share-section" aria-label="{{SHARE_LABEL}}"></section>
      </article>
    </main>

{{FOOTER}}

    <script src="../post-share.js?v={{SHARE_SCRIPT_VERSION}}"></script>
    <script src="../theme-toggle.js?v={{THEME_SCRIPT_VERSION}}"></script>
  </body>
</html>
